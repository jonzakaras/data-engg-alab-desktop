name: Build and publish image

# Tag pushes (v*) are handled by release-publish.yml, not here: a `push`
# trigger's `paths` filter applies to every ref it matches, tags included, so
# combining `tags: ["v*"]` with `paths: [".devcontainer/**"]` in one trigger
# means tagging an existing main commit (the normal release flow) often
# wouldn't touch that path in the tag's own diff and would silently never
# fire. Splitting into two workflows keeps this one's path filter meaningful
# while giving tag pushes their own unfiltered trigger.
#
# `workflow_dispatch` is the escape hatch for the cases the path filter can't
# see: republishing after a change to this workflow itself (registry, tags,
# build args), or re-pushing `:latest` when a previous run failed.
on:
  push:
    branches: [main]
    paths: [".devcontainer/**"]
  workflow_dispatch:

# The namespace must match this repo's owner: Actions' GITHUB_TOKEN is scoped
# to the owning account, so pushing to another account's namespace (e.g. an
# org this repo doesn't live in) fails with "permission_denied: The requested
# installation does not exist". If the repo is ever transferred to an org,
# update this and release-publish.yml's IMAGE_NAME to match.
env:
  IMAGE_NAME: ghcr.io/jonzakaras/alab-desktop

jobs:
  build-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-,format=short

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .devcontainer
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
